<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kashif Minhaj</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        color: white;
      }

      .card {
        text-align: center;
        padding: 50px;
        border: 1px solid #334155;
        border-radius: 20px;
        background: #1e293b;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .hello {
        font-size: 18px;
        color: #94a3b8;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 56px;
        margin-bottom: 15px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: #cbd5e1;
        font-size: 18px;
      }

      .button {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 24px;
        background: #38bdf8;
        color: #0f172a;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
      }

      .button:hover {
        background: #7dd3fc;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="hello">Hello, I'm</div>

      <h1>Kashi</h1>

      <p>Designer • Developer • Creator</p>

      <a href="#" class="button">Explore</a>
    </div>
  </body>
</html>
